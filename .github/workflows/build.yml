name: Build

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# 共享编译缓存：sccache 把每个 crate 的编译对象按 hash 存到 GitHub Actions Cache，
# 跨发版 / 跨 PR 命中（依赖不变时基本秒级）；第一次或改了大段 Rust 仍要全编。
env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # 轻量测试：仅 PR / 非 tag 的 push / 手动触发时跑，保护合入质量（用 dev 编译，快）。
  # tag 发版时跳过本 job —— 由 build-windows 内的 `cargo test --release` 统一覆盖，
  # 避免 dev + release 两遍全量依赖编译（A 优化的核心）。
  test:
    name: Rust test suite (Windows)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup (跨 PR 编译缓存)
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: cargo test
        run: cargo test --no-default-features
        working-directory: desktop/src-tauri

  # macOS 编译门禁。为何需要它：本项目主力平台是 Windows，开发机也是 Windows，
  # 而平台差异（平台专属 crate feature、缺失的 cfg(not(windows)) 分支、Win32 API 调用）
  # **只会在 mac 编译时暴露**。没有这道门禁，Windows 侧的改动会静默破坏 mac 支持。
  #
  # 只跑 `cargo check`（不跑 test、不打包）：目标是尽快拿到编译期错误，控制 CI 时长。
  # 不装前端依赖：与上面 Windows 的 test job 一致，纯 Rust 检查不需要 dist 产物。
  #
  # 严格度与 Windows 侧**齐平**：两边都跑 `clippy --all-targets -D warnings`。
  # 曾经这里只能跑 `cargo check`，因为 mac 上 `firewall_diag.rs` 的 netsh 解析函数
  # 没有调用方、会产生 20+ 个 dead_code 警告；已按「类型定义跨平台保留 / netsh 解析
  # 逻辑 cfg(windows)」切分完毕（清单 N1），故升级为与 Windows 同等严格。
  # `--all-targets` 会连测试代码一起编译——mac 上跑不了的测试必须带 cfg(windows)，
  # 否则这里会红。
  check-macos:
    name: Rust check + test (macOS)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: clippy (与 Windows 侧同等严格)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
        working-directory: desktop/src-tauri
      # 真实跑测试，而不只是编译。cc-bridge 的核心是 MCP HTTP 服务与命令执行，
      # 这两块**不依赖 GUI**，完全能在 CI 的 mac 上验证：sh -c 真实执行、
      # 会话 cwd 捕获（pwd 写文件再读回）、进程树杀灭、文件工具、审计、SQLite。
      # 这是在没有 mac 设备的情况下，把 mac 侧从「写完没跑过」变成「跑过了」的唯一途径。
      # 仍验不到的只有 GUI：托盘外观与交互、窗口行为、桌面通知、Gatekeeper、自动更新。
      - name: cargo test（真实执行，非仅编译）
        run: cargo test --no-default-features
        working-directory: desktop/src-tauri

  # ── macOS GUI / 打包 / 分发烟测 ────────────────────────────────────────────
  # 为什么会有这个 job：check-macos 已证明 MCP 服务与命令执行在真实 macOS 上跑得通
  # （130 passed），但当时把「GUI / 打包 / 分发」整块判成「只能真机验证」。重新审过
  # 后发现这个判定过宽——GitHub 的 macOS runner 带图形会话（自动登录的 Aqua session），
  # 下面这些其实都能在 CI 里拿到实证，而不是靠推理：
  #   · .app 能否构建、ad-hoc 签名是否成立（codesign --verify）
  #   · Gatekeeper 对未公证包的评估结论（spctl -a -vvv）
  #   · 「从浏览器下载后解压」的 quarantine 陷阱，以及 xattr -dr 解法是否真的管用
  #   · 应用能否真的起起来、MCP 服务是否自动监听（/health 探活）
  #   · webview 的内存代价（第二次启动触发 single-instance 显示窗口，前后采样 RSS）
  #   · 桌面通知链路（用应用自己的 push_notification 工具端到端走一遍）
  #   · 退出语义：Apple Event quit（等价 Cmd+Q）是否被我们拦 ExitRequested 的改动误伤
  #
  # 关键技巧：窗口配置是 visible:false（启动即收托盘），CI 里没有辅助权限（TCC）无法
  # 点托盘菜单。但**再启动一次同一个二进制**会触发 single-instance 插件回调 →
  # show_or_create_main_window，这是唯一不需要 TCC 就能把窗口显示出来的途径。
  #
  # 真机仍不可替代的只剩「人眼观感」：托盘图标在深浅色菜单栏下好不好看、左键手感。
  # 那部分靠上传的截图人工看，做不到自动断言。
  #
  # 只在 workflow_dispatch 触发：mac 上整套 tauri build 约 10 分钟，不值得挂在每个 PR 上。
  # 手动跑：gh workflow run build.yml --ref main
  smoke-macos:
    name: macOS GUI/打包/分发烟测（按需触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      # 自动更新端到端验证需要临时建一个 prerelease 当 https 测试源（跑完即删）。
      # 本地自签证书行不通：endpoints() 在 release 构建下要求 https，而 updater 默认
      # feature 是 rustls-tls 且未启用 native-roots，把证书加进钥匙串也不管用。
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      # 探针：runner 到底有没有图形会话。没有的话后面所有 GUI 步骤都不必看结论了，
      # 直接据此判定「必须真机」——这是用事实替代猜测的前提。
      - name: 探针 · 图形会话可用性
        continue-on-error: true
        run: |
          set +e
          echo "::group::会话身份与系统信息"
          id
          echo "launchctl managername = $(launchctl managername 2>&1)   # Aqua = 有图形会话"
          echo "SSH_CONNECTION=${SSH_CONNECTION:-<none>}"
          sw_vers
          echo "arch = $(uname -m)"
          echo "::endgroup::"

          echo "::group::screencapture 能否出图"
          screencapture -x "$RUNNER_TEMP/probe.png"
          echo "screencapture exit=$?"
          ls -l "$RUNNER_TEMP/probe.png" 2>&1
          echo "::endgroup::"

          echo "::group::osascript 能否驱动 System Events（TCC 辅助权限）"
          osascript -e 'tell application "System Events" to return name of first process' 2>&1
          echo "osascript exit=$?"
          echo "::endgroup::"

      # 上一轮截图里看到屏幕正中间站着一个系统模态框：「bash is requesting to bypass
      # the system private window picker...」——macOS 的屏幕录制（TCC）授权框，由第一次
      # screencapture 触发。它是模态的且抢键盘焦点，后果有两个：
      #   1. 后续所有截图都被它污染（遮住了真正要看的窗口）；
      #   2. 发给应用的按键（Cmd+W）实际被它吃掉 —— 上一轮关窗验证就是这么失真的。
      # 所以必须先把它点掉，而且得在每次交互前重新点一次（它会反复弹）。
      - name: 清除 TCC 屏幕录制授权模态框
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/mac-dismiss-dialogs.sh

      - name: Install frontend deps
        run: |
          npm ci
          # 与 Windows 侧同一个 npm optionalDependencies 坑（npm/cli#4828）：
          # Tauri CLI 的平台 native binding 可能不被装上，显式补一次，不写回 lock。
          if [ "$(uname -m)" = "arm64" ]; then
            npm install @tauri-apps/cli-darwin-arm64 --no-save || true
          else
            npm install @tauri-apps/cli-darwin-x64 --no-save || true
          fi
        working-directory: desktop

      # tauri.conf.json 里 createUpdaterArtifacts=true，没有私钥会直接构建失败，
      # 所以烟测现场生成一把一次性密钥。
      #
      # ⚠ 必须同时把它的**公钥**写进 tauri.conf.json：我最初在这里写的注释是
      # 「公钥对不上只影响客户端校验更新，不影响本 job 要验的行为」——那只在「只验
      # 打包」时成立。自从加了自动更新端到端验证，那句就变成了错误前提：
      # 更新链路的核心恰恰包含验签。实际后果是连续三轮报
      #   "The signature was created with a different key than the one provided"
      # ——包下载下来了但验签失败，替换永远不会发生。
      # pubkey 必须在 `tauri build` **之前**写入，因为它会被编译进二进制。
      - name: 生成一次性更新签名密钥（并把配对公钥写进配置）
        run: |
          set -e
          npx tauri signer generate -w "$RUNNER_TEMP/smoke.key" -p "" -f
          ls -l "$RUNNER_TEMP"/smoke.key*
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/smoke.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"
          # 要写进 pubkey 的是「公钥文件全文的 base64」。坑：`tauri signer generate`
          # 产出的 .pub **文件内容本身就已经是 base64**（解码后才是
          # "untrusted comment: minisign public key: ..." 那两行）。我最初又 base64 了一次，
          # 双重编码导致构建直接报
          #   failed to decode pubkey: ... Missing encoded key in public key
          # 所以下面按**内容**自动判断而不是猜：能解出 minisign 头就直接用，
          # 否则才编码一次（将来 Tauri 改格式也不会悲剧）。
          PUB=$(node -e "
            const fs=require('fs'), f=process.argv[1];
            const raw=fs.readFileSync(f,'utf8').replace(/\s+/g,'');
            let out;
            try {
              out = Buffer.from(raw,'base64').toString('utf8').startsWith('untrusted comment')
                ? raw
                : fs.readFileSync(f).toString('base64');
            } catch (e) { out = fs.readFileSync(f).toString('base64'); }
            process.stdout.write(out);
          " "$RUNNER_TEMP/smoke.key.pub")
          echo "pubkey 长度=${#PUB}，解码首行：$(printf '%s' "$PUB" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(Buffer.from(s,'base64').toString().split('\n')[0]))")"
          PUB="$PUB" node -e "
            const fs=require('fs'), p='src-tauri/tauri.conf.json';
            const j=JSON.parse(fs.readFileSync(p,'utf8'));
            const before=j.plugins.updater.pubkey.slice(0,24);
            j.plugins.updater.pubkey=process.env.PUB;
            fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');
            console.log('pubkey 已换为烟测一次性密钥的配对公钥（仅 CI 工作区临时改动，不提交）');
            console.log('  改前：'+before+'…  改后：'+j.plugins.updater.pubkey.slice(0,24)+'…');
          "
        working-directory: desktop

      - name: 构建 .app（ad-hoc 签名）
        run: |
          npm run prebuild
          # bundle.targets 固定为 nsis（Windows 发版路径），mac 上用 --bundles 覆盖。
          # 故意不往配置里加 mac target：那条路径是正式发版用的，不拿它做实验。
          npx tauri build --bundles app
        working-directory: desktop

      - name: 签名与 Gatekeeper 评估
        continue-on-error: true
        run: |
          set +e
          APP="desktop/src-tauri/target/release/bundle/macos/cc-bridge.app"
          ls -la desktop/src-tauri/target/release/bundle/macos/ 2>&1
          echo "::group::codesign -dv（签名主体，ad-hoc 应显示 Signature=adhoc）"
          codesign -dv --verbose=4 "$APP" 2>&1
          echo "::endgroup::"
          echo "::group::codesign --verify（签名完整性）"
          codesign --verify --deep --strict --verbose=2 "$APP" 2>&1
          echo "verify exit=$?"
          echo "::endgroup::"
          echo "::group::spctl -a -vvv（Gatekeeper 对未公证包的结论）"
          spctl -a -vvv -t exec "$APP" 2>&1
          echo "spctl exit=$?   # 非 0 属预期：ad-hoc + 未公证"
          echo "::endgroup::"

      # 这一步验的是「别人拿到我们的包会撞上什么」。ad-hoc 签名包在别人电脑上被拦，
      # 直接原因不是签名无效，而是浏览器/网盘下载时 LaunchServices 写的 quarantine 属性。
      - name: 分发陷阱 · quarantine 隔离属性
        continue-on-error: true
        run: |
          set +e
          SRC="desktop/src-tauri/target/release/bundle/macos/cc-bridge.app"
          Q="$RUNNER_TEMP/quarantined/cc-bridge.app"
          mkdir -p "$RUNNER_TEMP/quarantined"
          cp -R "$SRC" "$Q"
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$Q"
          echo "::group::打上隔离属性后"
          xattr -l "$Q"
          spctl -a -vvv -t exec "$Q" 2>&1
          echo "spctl exit=$?"
          echo "::endgroup::"
          echo "::group::用户侧解法是否真的管用：xattr -dr com.apple.quarantine"
          xattr -dr com.apple.quarantine "$Q"
          echo "清除后属性列表（空即已清除）：[$(xattr -l "$Q")]"
          spctl -a -vvv -t exec "$Q" 2>&1
          echo "spctl exit=$?"
          echo "::endgroup::"

      - name: 启动应用 + MCP 服务探活
        run: |
          set +e
          APP="$PWD/desktop/src-tauri/target/release/bundle/macos/cc-bridge.app"
          # 不能写死 MacOS/cc-bridge：.app **目录名**用 productName（cc-bridge），而里面的
          # **可执行文件名**用 Cargo 包名（cc-bridge-desktop），两者不一致。
          # 第一轮 CI 就挂在这里（No such file or directory）——改从 Info.plist 取真值。
          BIN_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BIN="$APP/Contents/MacOS/$BIN_NAME"
          echo "CFBundleExecutable=$BIN_NAME"
          ls -l "$APP/Contents/MacOS/"
          echo "APP_BIN=$BIN" >> "$GITHUB_ENV"
          LOG="$RUNNER_TEMP/app-1.log"
          "$BIN" > "$LOG" 2>&1 &
          PID=$!
          echo "APP_PID=$PID" >> "$GITHUB_ENV"
          echo "已启动 pid=${PID}，窗口 visible:false，预期直接收进托盘"
          code=""
          for i in $(seq 1 40); do
            code=$(curl -s -o "$RUNNER_TEMP/health.json" -w '%{http_code}' --max-time 2 http://127.0.0.1:7823/health)
            if [ "$code" = "200" ]; then
              echo "✅ 第 ${i} 次探测命中：/health 200 —— MCP 服务在 mac 上自动起来了"
              cat "$RUNNER_TEMP/health.json"; echo
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "❌ 进程在第 ${i} 次探测前就退出了，这是 mac 启动路径的硬失败。日志："
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "❌ 40 秒内 /health 未就绪。日志："
            cat "$LOG"
            exit 1
          fi

      - name: 内存代价（托盘态 vs 显示窗口后）
        continue-on-error: true
        run: |
          set +e
          sample() {
            echo "::group::$1"
            ps -o pid,rss,vsz,comm -p "$APP_PID"
            # footprint 口径更接近活动监视器。注意：不能拿这里的数字直接跟 Windows 侧那
            # 82MB 比——那是 Private Working Set，口径不同；只看 mac 自己的前后差值。
            sudo /usr/bin/footprint -p "$APP_PID" 2>&1 | tail -8
            echo "— 同名相关进程（看 WKWebView 是否另起进程）—"
            ps ax -o pid,rss,comm | grep -i -e cc-bridge -e WebKit -e WebContent | grep -v grep
            echo "::endgroup::"
          }
          # 窗口数断言：用 unix id 定位进程，避开猜 System Events 里的进程名。
          wins() { osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to return count of windows" 2>&1; }
          echo "AX 看到的进程名 = $(osascript -e "tell application \"System Events\" to return name of (first process whose unix id is $APP_PID)" 2>&1)"
          # 注意口径：visible:false 只是不显示，**窗口对象与 webview 在启动时就已创建**，
          # 所以 AX 窗口数本来就是 1（上一轮我把预期写成 0，是我对口径的误解）。
          # 窗口数的真正用处是分辨关窗后的两种结局：销毁 → 0，hide → 仍为 1。
          sample "启动态（窗口已创建但隐藏）"
          echo "启动态窗口数 = $(wins)   # 1 属正常：visible:false 不等于未创建"
          # 第二次启动同一二进制 → single-instance 回调 → show_or_create_main_window。
          "$APP_BIN" > "$RUNNER_TEMP/app-2.log" 2>&1
          echo "第二实例退出码=$?，应为 0 且由 single-instance 把主窗口拉起来"
          sleep 10
          sample "显示窗口后（webview 已创建）"
          echo "显示后窗口数 = $(wins)   # 预期 1，这条就是 single-instance 活了的硬证据"

      # 验证 generate-updater-json.mjs 真的能从 mac 产物生成 darwin-aarch64 条目。
      # 之前它只认 bundle/nsis，所以 mac 自动更新一直是**完全不通**的（客户端找不到
      # 自己的平台 key 就永远检测不到更新，而且不报错）。这一步把它钉住。
      - name: updater.json 生成（验 darwin-aarch64 条目）
        continue-on-error: true
        run: |
          set +e
          echo "::group::只有 mac 产物时"
          npm run updater:generate 2>&1 | tail -30
          echo "::endgroup::"
          echo "::group::跨 job 合并语义（模拟已有 windows 条目的 json）"
          printf '%s' '{"version":"0.0.0","platforms":{"windows-x86_64":{"signature":"FAKE","url":"https://example.com/x.exe"}}}' > "$RUNNER_TEMP/base.json"
          UPDATER_MERGE_INTO="$RUNNER_TEMP/base.json" UPDATER_OUTPUT_FILENAME=updater-merged.json npm run updater:generate 2>&1 | tail -30
          echo "--- 合并结果的平台 key（应同时有 windows-x86_64 与 darwin-aarch64）---"
          node -e "const j=require('$PWD/dist/updater-merged.json');console.log(Object.keys(j.platforms).join(', '))"
          echo "::endgroup::"
        working-directory: desktop

      # 关键探针：AX 能不能看到 webview 内部元素。这一条结论同时决定两件事：
      #   能否点「立即更新」（自动更新能否在 CI 真跑）、
      #   能否点自绘标题栏的关闭按钮（N15/N8 的关窗验证能否自动化）。
      - name: 探针 · AX 能否穿进 webview
        continue-on-error: true
        run: bash .github/scripts/mac-ax-probe.sh "$APP_PID"

      # 上一轮已证实 AX 能穿进 webview（AXWebArea=1、136 个元素、按钮中文名都读得到）。
      # 于是可以真的跑 UI 流程了。这一步的目标是把「检查更新 / 立即更新」那几个按钮的
      # **真实可访问名称**摸出来——下一步搭完整自动更新链路靠它们定位。
      # 启动后停在首次引导页，得先跳过引导才能进主界面。
      - name: 走 UI 流程 · 跳过引导 → 进设置页（摸「检查更新」按钮名）
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/mac-ax-click.sh "$APP_PID" "跳过引导"
          sleep 4
          bash .github/scripts/mac-ax-buttons.sh "$APP_PID" "跳过引导后的主界面"
          bash .github/scripts/mac-ax-click.sh "$APP_PID" "设置"
          sleep 4
          bash .github/scripts/mac-ax-buttons.sh "$APP_PID" "设置页（找检查更新 / 关于卡片）"
          mkdir -p "$RUNNER_TEMP/shots"
          screencapture -x "$RUNNER_TEMP/shots/07-settings.png" 2>/dev/null

      - name: 截图（托盘图标 + 主窗口实际渲染）
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/shots"
          screencapture -x "$RUNNER_TEMP/shots/01-full.png"; echo "full exit=$?"
          # 单截顶部菜单栏，方便看模板图标（icon_as_template）在菜单栏里的实际观感
          screencapture -x -R 0,0,2400,44 "$RUNNER_TEMP/shots/02-menubar.png"; echo "menubar exit=$?"
          ls -l "$RUNNER_TEMP/shots"

      # 关窗行为是 release_webview_on_close 这个开关在 mac 上的真实表现，也是清单 N8
      # 要的那个数字。窗口是 decorations:false 自绘标题栏，没有系统关闭按钮且 webview 内容
      # 对辅助功能是一整块，AX 点不到那个自绘按钮。改走 Cmd+W（Tauri 在 macOS 默认
      # 生成的 Window 菜单里有 close_window），它同样触发 CloseRequested，路径一致。
      - name: 关窗行为（Cmd+W → 销毁 webview 但不退应用）
        continue-on-error: true
        run: |
          set +e
          wins() { osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to return count of windows" 2>&1; }
          rss() { ps -o rss= -p "$APP_PID" | tr -d ' '; }
          mkdir -p "$RUNNER_TEMP/shots"
          # 先清掉可能又弹出来的系统模态框，否则下面的按键/点击全发给它了
          bash .github/scripts/mac-dismiss-dialogs.sh
          web() { ps ax -o pid,rss,comm | grep -i WebContent | grep -v grep | awk '{print $1":"$2"KB"}' | tr '\n' ' '; }
          echo "关窗前：窗口数=$(wins) RSS=$(rss)KB WebContent=[$(web)]"
          osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $APP_PID) to true" 2>&1
          sleep 2
          # 优先走**产品真实路径**：点自绘标题栏里那个关闭按钮（AX 名称就叫「关闭窗口」）。
          # 它走前端 close() → CloseRequested → release_webview_on_close 分支，
          # 而不是 AppKit 那个对无关闭按钮窗口空转的 performClose:（见清单 N15）。
          bash .github/scripts/mac-ax-click.sh "$APP_PID" "关闭窗口"
          sleep 10
          echo "点自绘关闭按钮后：窗口数=$(wins) RSS=$(rss)KB WebContent=[$(web)]"
          # 仅当 AX 点自绘按钮没关掉窗口时，才回去试 AppKit 那两条路做对照。
          if [ "$(wins)" = "1" ]; then
          echo "—— 自绘按钮未关掉窗口，回去试 AppKit 路径作对照 ——"
          # 先把 Window 菜单里有什么打出来：如果根本没有 Close Window，
          # 那 Cmd+W 本身就不存在，验证得换另一条路——这个信息必需先确认。
          echo "Window 菜单项：$(osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to return name of every menu item of menu 1 of menu bar item \"Window\" of menu bar 1" 2>&1)"
          # 点菜单项比发按键可靠：不依赖键盘焦点落在哪里。上一轮就是因为 TCC
          # 模态框抢了焦点，Cmd+W 根本没递到应用，得出了「关窗未生效」的假结论。
          osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to click menu item \"Close Window\" of menu 1 of menu bar item \"Window\" of menu bar 1" 2>&1
          echo "点 Close Window 菜单项 exit=$?"
          sleep 8
          if [ "$(wins)" = "1" ]; then
            echo "菜单项路径看上去没生效，再补一次真实按键 Cmd+W 作为对照"
            osascript -e 'tell application "System Events" to keystroke "w" using command down' 2>&1
            echo "Cmd+W 按键 exit=$?"
            sleep 8
          fi
          echo "菜单/按键路径后：窗口数=$(wins) RSS=$(rss)KB"
          else
            echo "✅ AX 点自绘关闭按钮已把窗口关掉（窗口数已不再是 1），跳过 AppKit 对照"
          fi
          # 假设：窗口是 decorations:false（无标题栏），AppKit 的 performClose: 对「没有
          # 关闭按钮的窗口」是 no-op（只响一声）——而 Close Window 菜单项与 Cmd+W 走的
          # 就是 performClose:。先把窗口按钮列表打出来验证这个假设。
          echo "窗口按钮列表：$(osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to return name of every button of window 1" 2>&1)   # 空 = 无标题栏按钮，performClose: 就是空转"
          # 不管 AppKit 那条路通不通，都要测**产品真实路径**：点托盘图标。
          # 它走 on_tray_icon_event → w.close() → CloseRequested → 销毁 webview，
          # 完全不经 AppKit 的关闭按钮逻辑。menu bar 2 就是状态栏。
          if [ "$(wins)" = "1" ]; then
            echo "改走产品真实路径：点菜单栏托盘图标（→ w.close()）"
            osascript -e "tell application \"System Events\" to tell (first process whose unix id is $APP_PID) to click menu bar item 1 of menu bar 2" 2>&1
            echo "点托盘 exit=$?"
            sleep 10
          fi
          echo "关窗后：窗口数=$(wins) RSS=$(rss)KB"
          # 关键口径：mac 的 webview 跑在独立的 WebContent 进程里，主进程 RSS 看不出销毁。
          # 销毁成功的硬标志是这个进程**消失**——也就是清单 N8 要的那个数字。
          echo "关窗后 WebContent 进程（空 = 已销毁）："
          ps ax -o pid,rss,comm | grep -i -e WebContent -e cc-bridge | grep -v grep
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "✅ 关窗后进程仍存活 —— ExitRequested{code:None} 拦截在 mac 上也生效，服务没被带走"
          else
            echo "❌ 关窗把整个应用带退了 —— mac 上拦截失效，MCP 服务会断，这是阻塞缺陷"
          fi
          echo "关窗后 /health 仍否存活：$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:7823/health)"
          screencapture -x "$RUNNER_TEMP/shots/04-after-close.png" 2>/dev/null

      - name: 桌面通知链路（走应用自己的 push_notification）
        continue-on-error: true
        run: |
          set +e
          DIR="$HOME/Library/Application Support/com.ccbridge.desktop"
          echo "::group::应用数据目录（验证 mac 路径解析正确）"
          ls -l "$DIR" 2>&1
          echo "::endgroup::"
          # config 表是 key/value，value 为 JSON 字符串，故要剥掉引号
          TOKEN=$(sqlite3 "$DIR/cc-bridge.db" "select value from config where key='token';" 2>&1 | tr -d '"')
          echo "token 长度=${#TOKEN}"
          curl -sS -X POST http://127.0.0.1:7823/mcp \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"push_notification","arguments":{"title":"CI 烟测","body":"mac 通知链路验证"}}}' 2>&1 | head -c 2000
          echo
          sleep 3
          screencapture -x "$RUNNER_TEMP/shots/03-notification.png"; echo "shot exit=$?"

      # 本 job 里价值最高的一条：我们为了「关窗不退出应用」加了
      #   RunEvent::ExitRequested { code: None, .. } => api.prevent_exit()
      # 需要确认它没把 mac 上用户主动 Cmd+Q 也一起拦掉（那会变成退不掉的应用）。
      # osascript 的 quit 发的是 kAEQuitApplication，与 Cmd+Q 同一条路径。
      - name: 退出语义（Apple Event quit ≈ Cmd+Q）
        continue-on-error: true
        run: |
          set +e
          bash .github/scripts/mac-dismiss-dialogs.sh
          echo "退出前存活检查：$(kill -0 "$APP_PID" 2>/dev/null && echo alive || echo dead)"
          # 先发真实按键 Cmd+Q（完全走用户那条路径）。前面已关窗，此时应用只剩托盘，
          # 先把它拉到前台才接得到按键。
          osascript -e "tell application \"System Events\" to set frontmost of (first process whose unix id is $APP_PID) to true" 2>&1
          sleep 2
          osascript -e 'tell application "System Events" to keystroke "q" using command down' 2>&1
          echo "Cmd+Q 真实按键 exit=$?"
          sleep 6
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "⚠ Cmd+Q 后进程仍存活，再试 Apple Event quit 区分是「按键没递到」还是「真的拦住了」"
            osascript -e 'tell application "cc-bridge" to quit' 2>&1
            echo "Apple Event quit exit=$?"
            sleep 6
            if kill -0 "$APP_PID" 2>/dev/null; then
              echo "⚠⚠ 两种退出都没用 —— ExitRequested 拦截很可能误伤了用户主动退出，得改"
            else
              echo "✅ Apple Event quit 生效 —— 拦截未误伤退出；上一步失败只是按键未递到"
            fi
          else
            echo "✅ Cmd+Q 后进程已退出 —— 用户主动退出未被 ExitRequested{code:None} 拦截误伤"
          fi

      # 上一轮拿到的事实：spctl -a 对 ad-hoc 包永远报 rejected，**连清掉 quarantine 后也是
      # rejected**。但 spctl 判的是「能不能过公证策略」，Gatekeeper 实际只拦带 quarantine 的包。
      # 所以光看 spctl 会得出「永远打不开」的错误结论——必须真的 open 一次才算数。
      - name: 分发陷阱复验·带/不带隔离属性实际能不能启动
        continue-on-error: true
        run: |
          set +e
          pkill -f cc-bridge-desktop 2>/dev/null; sleep 3
          Q="$RUNNER_TEMP/quarantined2/cc-bridge.app"
          mkdir -p "$RUNNER_TEMP/quarantined2"
          cp -R "$PWD/desktop/src-tauri/target/release/bundle/macos/cc-bridge.app" "$Q"
          xattr -w com.apple.quarantine "0083;00000000;Safari;" "$Q"
          mkdir -p "$RUNNER_TEMP/shots"
          echo "::group::带隔离属性 open"
          # 上一轮这一步卡死了 11 分钟：Gatekeeper 弹模态框，`open` 在等 LaunchServices
          # 回报启动结果，而模态框没人点就永远等不到。改成后台跑 + 有界等待。
          open -n "$Q" > "$RUNNER_TEMP/open-q.log" 2>&1 &
          OPEN_PID=$!
          sleep 10
          if kill -0 "$OPEN_PID" 2>/dev/null; then
            echo "open 仍在阻塞（这本身就是被 Gatekeeper 模态框拦住的信号），强行结束"
            kill -9 "$OPEN_PID" 2>/dev/null
          fi
          echo "open 输出：$(cat "$RUNNER_TEMP/open-q.log" 2>/dev/null)"
          screencapture -x "$RUNNER_TEMP/shots/05a-gatekeeper-block.png" 2>/dev/null
          echo "服务是否起来了：$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:7823/health)   # 000 = 未启动（被拦）"
          screencapture -x "$RUNNER_TEMP/shots/05-quarantine-dialog.png" 2>/dev/null
          pkill -f cc-bridge-desktop 2>/dev/null; sleep 3
          echo "::endgroup::"
          echo "::group::清掉隔离属性后再 open"
          xattr -dr com.apple.quarantine "$Q"
          open -n "$Q" > "$RUNNER_TEMP/open-q2.log" 2>&1 &
          OPEN_PID2=$!
          sleep 12
          kill -9 "$OPEN_PID2" 2>/dev/null
          echo "open 输出：$(cat "$RUNNER_TEMP/open-q2.log" 2>/dev/null)"
          echo "服务是否起来了：$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:7823/health)   # 200 = xattr -dr 确实管用"
          screencapture -x "$RUNNER_TEMP/shots/06-after-dequarantine.png" 2>/dev/null
          pkill -f cc-bridge-desktop 2>/dev/null
          echo "::endgroup::"

      # 清单 N11 的核心风险：「更新后打不开」是脉冲式故障——发了才知道，且用户已经
      # 升不回去。前面已按源码推翻了文档里的两条推测，但推翻推测不等于验过，
      # 这一步真的跑一遍：检查 → 下载 → 验签 → 替换 .app → 重启能否启动。
      - name: 自动更新 · 完整链路真跑（临时 prerelease 作 https 源，跑完即删）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/mac-updater-e2e.sh \
            "$PWD/desktop/src-tauri/target/release/bundle/macos/cc-bridge.app" \
            "$APP_BIN" \
            "$RUNNER_TEMP/smoke.key"

      - name: 收尾 · 结束进程并收集证据
        if: always()
        continue-on-error: true
        run: |
          set +e
          kill -TERM "$APP_PID" 2>/dev/null; sleep 2; kill -9 "$APP_PID" 2>/dev/null
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/app-*.log "$RUNNER_TEMP/out/" 2>/dev/null
          cp -R "$RUNNER_TEMP/shots" "$RUNNER_TEMP/out/" 2>/dev/null
          cp -R "$HOME/Library/Logs/com.ccbridge.desktop" "$RUNNER_TEMP/out/app-logs" 2>/dev/null
          ls -lR "$RUNNER_TEMP/out" 2>&1
          # 直接把应用 stdout 打进 CI 日志：上一轮还得下载 artifact 才能看到它，
          # 而里面的内容（updater 报错）恰好是判断前端有没有真的跑起来的关键证据。
          echo "::group::应用 stdout（app-1.log）"
          cat "$RUNNER_TEMP/app-1.log" 2>/dev/null
          echo "::endgroup::"
          echo "::group::应用日志目录探查"
          ls -la "$HOME/Library/Logs/" 2>&1 | head -20
          echo "::endgroup::"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-smoke-evidence
          path: ${{ runner.temp }}/out/**
          if-no-files-found: warn

  # ── mac 发版构建（仅 tag 触发，在 build-windows 之前跑）──────────────────
  # 为何要比 Windows 先跑：updater.json 只能有一份（attach 到同一个 Release），
  # 而两个平台在不同 job 里构建、各自只看得到自己的产物。若两边都自行生成并 attach，
  # 后跑的会**静默覆盖**先跑那个平台的条目 → 那个平台的用户失去自动更新。
  # 所以 mac 只把自己的平台条目当**片段**产出（不 attach updater.json），
  # 由 build-windows 用 UPDATER_MERGE_INTO 合并后统一 attach。
  #
  # 只出 arm64（已确认）。不出 dmg：烟测只验过 --bundles app，dmg 从未构建过，
  # 内网分发给 zip 就够，多出一个未验证的环节不划算。
  build-macos:
    name: Build macOS app (arm64)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 🔑 准备签名密钥（文件路径方式）
        run: |
          RAW='${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          if [ -z "$(printf '%s' "$RAW" | tr -d '[:space:]')" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY 未设置。mac 包必须签名，否则 updater 验签会报"
            echo "   'The signature was created with a different key than the one provided'，"
            echo "   用户下载得到包但永远装不上（烟测里已实际撞过这个）。"
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/tauri-signing.key"
          printf '%s' "$RAW" > "$KEY_FILE"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_FILE" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - name: Sccache Setup
        uses: mozilla/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        run: |
          npm ci
          npm install @tauri-apps/cli-darwin-arm64 --no-save || true
        working-directory: desktop

      # tag 发版时 check-macos 作业被跳过，而 main 的 push 也不在触发列表里，
      # 所以如果这里不跑，mac 侧在发版时就**完全没有测试覆盖**。
      # 用 release profile 跑，编译产物直接被下面 tauri build 复用（与 Windows 侧同策略）。
      - name: cargo test (release, 复用后续 build 的编译产物)
        run: cargo test --release --no-default-features
        working-directory: desktop/src-tauri

      - name: Build macOS .app
        run: |
          npm run prebuild
          # bundle.targets 固定为 nsis（Windows 发版用），mac 用 --bundles 覆盖。
          npx tauri build --bundles app
        working-directory: desktop

      # 生成两份平台片段：GitHub 路径与 Gitee 镜像路径的 URL 形状不同，
      # 各自都要一份，否则 mac 用户在 Gitee 那一组拿不到条目（updater 会返回
      # TargetsNotFound 错误→自动回退到 GitHub 组，功能不断但白多一轮重试延迟）。
      # 片段里的 version/notes 不重要：合并时只取 platforms，顶层字段由 Windows 侧提供。
      - name: 生成 mac 平台片段（GitHub 路径）
        run: |
          set -e
          UPDATER_OUTPUT_FILENAME=updater-macos.json npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_DOWNLOAD_BASE: "https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download"

      - name: 生成 Gitee 变体的 mac 片段（覆盖 URL 为 Gitee 直链）
        run: |
          set -e
          UPDATER_OUTPUT_FILENAME=updater-macos-gitee.json npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          UPDATER_URL_TEMPLATE: "https://gitee.com/${{ secrets.GITEE_REPOSITORY }}/raw/releases/latest/{filename}"

      - name: 校验 darwin-aarch64 签名非空
        run: |
          node -e "
            const j=require('./dist/updater-macos.json');
            const p=j.platforms['darwin-aarch64'];
            if(!p || !p.signature || !p.signature.trim()){
              console.error('❌ updater-macos.json 的 darwin-aarch64.signature 为空。');
              console.error('   mac 客户端会下载到包但验签失败、永远装不上。');
              process.exit(1);
            }
            console.log('darwin-aarch64 签名校验通过，url=' + p.url);
          "
        working-directory: desktop

      - name: 📦 打包给用户下载的 zip
        run: |
          set -e
          VERSION=$(node -e "console.log(require('./desktop/src-tauri/tauri.conf.json').version)")
          APP_DIR=desktop/src-tauri/target/release/bundle/macos
          ZIP="cc-bridge_${VERSION}_aarch64-apple-darwin.zip"
          # 用 ditto 而不是 zip：它会保留 .app 的资源叉与符号链接，
          # 普通 zip 会破坏 bundle 结构导致解压后打不开。
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/cc-bridge.app" "$ZIP"
          echo "✅ $ZIP  ($(du -h "$ZIP" | cut -f1))"

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p dist-out
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz dist-out/ 2>/dev/null || true
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist-out/ 2>/dev/null || true
          cp cc-bridge_*_aarch64-apple-darwin.zip dist-out/ 2>/dev/null || true
          # 平台片段只作为 artifact 传给 build-windows 合并，**不** attach 到 Release
          cp desktop/dist/updater-macos.json dist-out/ 2>/dev/null || true
          cp desktop/dist/updater-macos-gitee.json dist-out/ 2>/dev/null || true
          ls -l dist-out

      - uses: actions/upload-artifact@v5
        with:
          name: cc-bridge-macos
          path: dist-out/*

      # 只 attach 用户/updater 要下载的东西。updater.json 由 build-windows 合并后统一 attach，
      # 在这里 attach 会与它冲突。
      - name: Attach macOS 产物到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-out/*.app.tar.gz
            dist-out/*.app.tar.gz.sig
            dist-out/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发版构建：仅 tag 触发。test(release) 与 build 同 job 内复用 release target，
  # 依赖 crate 只编译一遍（A）；sccache 让依赖不变时后续发版秒级命中（B）。
  build-windows:
    name: Build Windows exe + installer
    # needs 使它在 mac 之后跑（发版串行，多花约 10 分钟）——因为它要合并 mac 的
    # 平台片段。`always()` 保证 **mac job 失败时 Windows 仍能发**（Windows 是主平台，
    # 不应被 mac 拖累）；此时下载片段会失败，而 generate 脚本对缺失的
    # UPDATER_MERGE_INTO 只 warn 不 fail，于是降级为只发 Windows 条目。
    needs: [build-macos]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要写权限（默认 token 只读）
    steps:
      - uses: actions/checkout@v5

      # 拉 mac 的平台片段与产物。continue-on-error：mac job 挂了不能连带 Windows 发不了。
      - name: 下载 mac 产物（用于合并 updater.json；缺失则降级为只发 Windows）
        id: dl-mac
        continue-on-error: true
        uses: actions/download-artifact@v5
        with:
          name: cc-bridge-macos
          path: mac-artifact

      - name: 🔑 准备签名密钥（文件路径方式）
        shell: pwsh
        run: |
          $raw = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          if ([string]::IsNullOrWhiteSpace($raw)) {
            Write-Host "⚠️ TAURI_SIGNING_PRIVATE_KEY 未设置，本次构建将不产生签名（.sig），updater 无法验证。"
            "TAURI_KEY_FILE=" >> $env:GITHUB_ENV
            exit 0
          }
          $keyFile = "${{ runner.temp }}\tauri-signing.key"
          [System.IO.File]::WriteAllText($keyFile, $raw, [System.Text.Encoding]::ASCII)
          "TAURI_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
          Write-Host "密钥文件已写入: $keyFile"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # C：缓存 npm 下载（~/.npm），npm ci 仍重装但省去网络下载。
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Sccache Setup (跨发版编译缓存)
        uses: mozilla/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        run: npm ci
        working-directory: desktop

      # A：用 release profile 跑测试，编译出的 release 依赖产物直接被下面 tauri build 复用。
      - name: cargo test (release, 复用后续 build 的编译产物)
        run: cargo test --release --no-default-features
        working-directory: desktop/src-tauri

      - name: Build Tauri desktop app (NSIS installer)
        shell: pwsh
        run: |
          # Workaround for https://github.com/npm/cli/issues/4828 — Tauri CLI 的 Windows native binding 是 optionalDependencies，
          # 在 fresh runner 上可能不被 npm 安装，导致 tauri build 报 Cannot find native binding。
          # 显式再装一次（幂等：已存在则跳过），不写回 package.json / package-lock.json（--no-save）。
          npm install @tauri-apps/cli-win32-x64-msvc --no-save
          # prebuild（版本同步 + 生成 changelog.generated.ts）独立执行，
          # 避免在 npm run 的 pre→build 钩子链中改写 package.json 导致后续 tauri 路径丢失。
          npm run prebuild
          $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_KEY_FILE
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""   # 空密码，避免 CI 无 TTY 时交互式提示卡死
          # npx 直接从 node_modules/.bin 解析 tauri，不依赖 npm run 的 PATH 上下文。
          npx tauri build
        working-directory: desktop

      - name: 抽取更新说明 (CHANGELOG)
        shell: pwsh
        run: |
          $changelog = Get-Content -Raw -Path CHANGELOG.md
          # 抽取「用户向分类小节」（含顶部 ### 更新摘要，渲染为弹框高亮卡片；及 ### 新增/修复/变更/优化/安全 等），写入更新弹框。
          # 每个小节下列 1~3 条人话要点（无代码符号、无根因），让用户一眼看懂升级了什么。
          # 正则要求版本号形如 x.y.z，避免误抓 [Unreleased]；抓到下一个版本头为止。
          # 剔除不进弹框的小节：### 用户摘要 / ### 技术细节 / ### 实现说明 / ### 开发者。
          if ($changelog -match '(?s)##\s*\[\d+\.\d+\.\d+\][^\n]*\n(.*?)(?=\n##\s\[|$)') {
            $notes = $matches[1].Trim()
            $notes = $notes -replace '(?s)\n###\s*(用户摘要|技术细节|实现说明|开发者)[\s\S]*?(?=\n###\s|\n##\s|$)', ''
            $notes = $notes.Trim()
            "UPDATER_NOTES<<EOF" >> $env:GITHUB_ENV
            $notes >> $env:GITHUB_ENV
            "EOF" >> $env:GITHUB_ENV
            Write-Host "已抽取用户向分类说明 ($($notes.Length) 字符)"
          } else {
            Write-Host "未在 CHANGELOG 中找到已发布版本段，使用默认说明"
          }

      - name: 生成 updater.json（合并 mac 平台条目）
        shell: pwsh
        run: npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          # 合并 mac 片段：不接这一句的后果是 mac 条目根本不进 updater.json，
          # mac 用户永远检测不到更新且不报错。指向不存在的文件时脚本只 warn，
          # 所以 mac job 挂了也不会把 Windows 发版带倒。
          UPDATER_MERGE_INTO: ${{ github.workspace }}\mac-artifact\updater-macos.json
          # 二进制下载走 ghproxy 镜像，解决国内用户下载慢；元数据检查另有 tauri.conf.json 的 GitHub 端点兜底。
          # 注意：updater.json 的 url 为单值、无二进制级兜底，故 ghproxy 域名需稳定；若失效改此 env + config 即可。
          UPDATER_DOWNLOAD_BASE: "https://ghproxy.net/https://github.com/${{ github.repository }}/releases/download"

      - name: 校验 updater.json 签名非空
        shell: pwsh
        run: |
          $json = Get-Content -Raw -Path desktop/dist/updater.json | ConvertFrom-Json
          $sig = $json.platforms.'windows-x86_64'.signature
          if ([string]::IsNullOrWhiteSpace($sig)) {
            Write-Error "updater.json 的 windows-x86_64.signature 为空，自动更新将无法校验签名。请确认 TAURI_SIGNING_PRIVATE_KEY 已配置且构建产生 .sig。"
            exit 1
          }
          Write-Host "updater.json windows-x86_64 签名校验通过"

          # mac 条目的合并结果必须显式确认：它缺失时**不会报错**，mac 用户只是
          # 永远检测不到更新——这种静默失效必须在发版时就看到。
          $macFragment = "${{ github.workspace }}\mac-artifact\updater-macos.json"
          $darwin = $json.platforms.'darwin-aarch64'
          if (Test-Path $macFragment) {
            if ($null -eq $darwin -or [string]::IsNullOrWhiteSpace($darwin.signature)) {
              Write-Error "mac 片段存在但 darwin-aarch64 未合并进 updater.json（或签名为空）。这会让 mac 用户静默失去自动更新，终止发版。"
              exit 1
            }
            Write-Host "updater.json darwin-aarch64 已合并，url=$($darwin.url)"
          } else {
            Write-Host "⚠️ 未拿到 mac 片段（mac job 可能失败或被跳过），本次 updater.json 只含 Windows。"
            Write-Host "   后果：mac 用户本次检测不到更新（不报错）。若本次应该包含 mac，请查 build-macos 作业。"
          }
          Write-Host "最终平台条目：$($json.platforms.PSObject.Properties.Name -join ', ')"

      - name: 📦 打包绿色便携版
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = "desktop/src-tauri/target/release/cc-bridge-desktop.exe"
          $zipName = "cc-bridge_$version`_x86_64-pc-windows-msvc.zip"

          if (-not (Test-Path $exePath)) {
            Write-Host "❌ 绿色版 exe 不存在: $exePath"
            exit 1
          }

          $exeDir = Split-Path $exePath -Parent
          $exeName = Split-Path $exePath -Leaf
          $zipFullPath = Join-Path $env:GITHUB_WORKSPACE $zipName
          Push-Location $exeDir
          Compress-Archive -Path $exeName -DestinationPath $zipFullPath -Force
          Pop-Location

          Write-Host "✅ 绿色版打包完成: $zipName"
          Write-Host "文件大小: $((Get-Item $zipFullPath).Length / 1MB) MB"

      - name: Collect artifacts
        shell: pwsh
        run: |
          mkdir dist-out -ErrorAction SilentlyContinue
          Copy-Item desktop\src-tauri\target\release\bundle\nsis\*.exe dist-out\ -ErrorAction SilentlyContinue
          Copy-Item desktop\src-tauri\target\release\bundle\nsis\*.exe.sig dist-out\ -ErrorAction SilentlyContinue
          Copy-Item desktop\dist\updater.json dist-out\ -ErrorAction SilentlyContinue
          Copy-Item cc-bridge_*.zip dist-out\ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v5
        with:
          name: cc-bridge-windows
          path: dist-out/*

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-out/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 以下两步解决国内用户直连 GitHub 下载安装包不稳定/很慢的问题：把产物同步一份到 Gitee（国内访问远比任何公共
      # GitHub 代理稳定），客户端（commands.rs）优先试 Gitee，失败再回退到现有的 ghproxy/GitHub 路径。
      # 两个 secret（GITEE_TOKEN/GITEE_REPOSITORY）未配置时自动跳过，不影响现有发版流程。
      - name: 生成 Gitee 版 updater-gitee.json（国内加速镜像，可选）
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.GITEE_REPOSITORY }}")) {
            Write-Host "⚠️ 未配置 GITEE_REPOSITORY secret，跳过 Gitee 镜像 manifest 生成（自动更新仍走现有 GitHub/ghproxy 路径）。"
            exit 0
          }
          npm run updater:generate
        working-directory: desktop
        env:
          GITHUB_RELEASE_TAG: ${{ github.ref_name }}
          # Gitee raw 文件直链与 GitHub Release 拼法形状不同（owner/repo/raw/ref/path，非
          # base/tag/filename），用 UPDATER_URL_TEMPLATE 完全接管拼接（见 generate-updater-json.mjs）。
          # 固定走 releases 分支下的 latest/ 目录（每次发版覆盖，不按 tag 累加）：
          # 客户端检查更新时事先不知道最新 tag 是什么，需要一个固定不变的 URL（对齐 GitHub
          # 的 releases/latest/download 语义）；固定目录也避免了镜像仓库随发版次数无限增长。
          UPDATER_URL_TEMPLATE: "https://gitee.com/${{ secrets.GITEE_REPOSITORY }}/raw/releases/latest/{filename}"
          UPDATER_OUTPUT_FILENAME: "updater-gitee.json"
          # 用 Gitee 变体的 mac 片段（URL 指向 Gitee 直链），不能用 GitHub 那份。
          UPDATER_MERGE_INTO: ${{ github.workspace }}\mac-artifact\updater-macos-gitee.json

      - name: 镜像发布产物到 Gitee（国内加速，可选）
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPOSITORY: ${{ secrets.GITEE_REPOSITORY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN) -or [string]::IsNullOrWhiteSpace($env:GITEE_REPOSITORY)) {
            Write-Host "⚠️ 未配置 GITEE_TOKEN/GITEE_REPOSITORY secret，跳过 Gitee 镜像发布。"
            exit 0
          }
          $tag = "${{ github.ref_name }}"
          try {
            $giteeUrl = "https://oauth2:$($env:GITEE_TOKEN)@gitee.com/$($env:GITEE_REPOSITORY).git"
            $mirrorDir = Join-Path $env:RUNNER_TEMP "gitee-mirror"

            # 独立临时目录里操作 Gitee remote，不动主 checkout 的分支/工作区状态。
            git clone --depth 1 --branch releases $giteeUrl $mirrorDir 2>&1
            if ($LASTEXITCODE -ne 0) {
              # releases 分支还不存在（首次发布）：clone 默认分支后本地新建孤儿分支。
              git clone --depth 1 $giteeUrl $mirrorDir 2>&1
              Push-Location $mirrorDir
              git checkout --orphan releases
              git reset --hard
              Pop-Location
            }

            # 固定覆盖 latest/ 目录（不按 tag 累加）：先清空旧内容再写新的，避免上一个版本不同文件名的
            # exe/sig 残留下来。
            $destDir = Join-Path $mirrorDir "latest"
            if (Test-Path $destDir) { Remove-Item $destDir -Recurse -Force }
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            Copy-Item dist-out/*.exe $destDir/ -ErrorAction SilentlyContinue
            Copy-Item dist-out/*.exe.sig $destDir/ -ErrorAction SilentlyContinue
            # mac 产物也得推上去：updater-gitee.json 里的 darwin 条目指向 Gitee 直链，
            # 不推就是指向一个不存在的文件 → mac 用户在 Gitee 那组下载 404、
            # 然后才回退到 GitHub（能成但白多一轮失败重试）。
            Copy-Item mac-artifact/*.app.tar.gz $destDir/ -ErrorAction SilentlyContinue
            Copy-Item mac-artifact/*.app.tar.gz.sig $destDir/ -ErrorAction SilentlyContinue
            Copy-Item desktop/dist/updater-gitee.json $destDir/ -ErrorAction SilentlyContinue

            Push-Location $mirrorDir
            git add -A latest
            git -c user.email="ci@cc-bridge.local" -c user.name="cc-bridge-ci" commit -m "release: mirror $tag to Gitee (latest)"
            git push origin releases
            Pop-Location

            Write-Host "✅ 已镜像到 Gitee releases 分支：$tag"
          } catch {
            Write-Host "⚠️ Gitee 镜像发布失败（不影响本次 GitHub Release 已发布内容，自动更新仍可走现有 GitHub/ghproxy 路径）：$_"
            exit 0
          }
