name: 功能建议
description: 想要的能力，或现有流程可以更顺的地方
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 README 的「已知限制」，有些边界是刻意留的（例如不做通用内网穿透）。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景，不要直接跳到方案。写清现在是怎么绕过去的。
      placeholder: |
        我在云主机上跑 Claude Code，代码在本机。现在每次要……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解法
      description: 界面在哪、点什么、发生什么。有替代方案也一并写。
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及区域
      options:
        - 连接页 / 接入向导
        - 终端 / SSH
        - 端口转发
        - MCP 工具能力
        - 对话 GUI
        - 设置 / 外观
        - 文档
        - 不确定
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括别的工具是怎么做的，以及为什么不够用。
    validations:
      required: false
